<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Inkwell mark v4: tilted nib drawing an ink stroke, original composition -->
  <rect width="512" height="512" rx="112" fill="#D85A30"/>
  <!-- the stroke the pen just drew: a rising swash -->
  <path d="M96 380 C 180 372, 300 356, 396 288" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
  <!-- nib: tilted kite with slit + breather hole -->
  <g transform="rotate(-38 300 176)">
    <path d="M300 96 L342 216 L300 248 L258 216 Z" fill="#FFFFFF"/>
    <circle cx="300" cy="196" r="13" fill="#D85A30"/>
    <path d="M300 209 L300 248" stroke="#D85A30" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- fresh drop falling off the tip -->
  <path d="M236 300 c 11 17, 17 26, 17 36 a 17 17 0 1 1 -34 0 c 0 -10, 6 -19, 17 -36 z" fill="#FFFFFF"/>
