<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Inkwell mark: a well of ink with a dipped nib dripping a drop -->
  <rect width="512" height="512" rx="112" fill="#D85A30"/>
  <!-- well body -->
  <path d="M150 210 h212 l-26 170 a40 40 0 0 1 -40 34 h-80 a40 40 0 0 1 -40 -34 z" fill="#FFFFFF"/>
  <!-- well rim -->
  <ellipse cx="256" cy="210" rx="106" ry="26" fill="#FFFFFF"/>
  <ellipse cx="256" cy="210" rx="76" ry="17" fill="#B4451F"/>
  <!-- ink surface -->
  <ellipse cx="256" cy="212" rx="60" ry="12" fill="#2C2C2A"/>
  <!-- nib dipping in -->
  <path d="M320 92 l30 118 -44 -22 z" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="10" stroke-linejoin="round"/>
  <!-- falling drop -->
  <path d="M262 300 c14 22 22 34 22 46 a22 22 0 1 1 -44 0 c0 -12 8 -24 22 -46 z" fill="#2C2C2A"/>
</svg>
