<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Inkwell v3: reads as "M"arkdown - ink-drop forms the M, pen nib below -->
  <rect width="512" height="512" rx="112" fill="#D85A30"/>
  <!-- rounded white card echoing a markdown badge -->
  <rect x="64" y="128" width="384" height="256" rx="40" fill="#FFFFFF"/>
  <!-- M drawn as two ink strokes -->
  <path d="M120 320 v-112 l48 72 48-72 v112" fill="none" stroke="#2C2C2A" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- down-arrow of the markdown mark -->
  <path d="M368 208 v96 m-30 -30 l30 30 30 -30" fill="none" stroke="#2C2C2A" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- coral drop accent between M and arrow -->
  <circle cx="256" cy="256" r="16" fill="#D85A30"/>
</svg>
